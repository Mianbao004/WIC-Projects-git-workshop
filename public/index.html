<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step Into the Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Step Into the Weather</h1>

    <form id="coords-form">
      <label>Latitude
        <input name="lat" type="number" step="any" min="-90" max="90" value="35.68" required>
      </label>
      <label>Longitude
        <input name="lon" type="number" step="any" min="-180" max="180" value="139.69" required>
      </label>
      <button type="submit">Step in</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" class="card" hidden>
      <h2 id="city"></h2>
      <p id="clock" class="clock"></p>
      <p id="temp" class="temp"></p>
      <p id="description"></p>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
