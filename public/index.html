<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step Into the Weather</title>
  <link rel="stylesheet" href="style.css"> <!--This CSS link ALWAYS goes in the head-->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon_io/favicon-16x16.png">
  <link rel="icon" href="/images/favicon_io/favicon.ico" sizes="any">
  <!-- Leaflet map library. integrity= makes the browser refuse the file if the CDN ever serves something different. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div> <!-- Weather animations are drawn on this layer by style.css -->
  <main>
    <h1>Step Into the Weather</h1>

    <div id="map"></div> <!-- Drag the person or click to pick a spot -->

    <form id="coords-form">
      <label>Latitude
        <input name="lat" type="number" step="any" min="-90" max="90" value="35.68" required>
      </label>
      <label>Longitude
        <input name="lon" type="number" step="any" min="-180" max="180" value="139.69" required>
      </label>
      <button type="submit">Go!</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" class="card" hidden> <!-- This is an easy way to have something "appear"-->
      <h2 id="city"></h2>
      <p id="clock" class="clock"></p>
      <p id="temp" class="temp"></p>
      <p id="description"></p>
    </section>
  </main>

  <script src="app.js" type="module"></script> <!--Connects your JS files-->
</body>
</html>
